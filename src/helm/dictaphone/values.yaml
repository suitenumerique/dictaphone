# Default values for dictaphone.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## @section General configuration

## @section Images
## @param images.backend.repository Repository for the backend and backend jobs
## @param images.backend.tag Backend image tag
## @param images.backend.pullPolicy Backend image pull policy
## @param images.frontend.repository Frontend image repository
## @param images.frontend.tag Frontend image tag
## @param images.frontend.pullPolicy Frontend image pull policy
## @param images.audioExtractor.repository Audio extractor image repository
## @param images.audioExtractor.tag Audio extractor image tag
## @param images.audioExtractor.pullPolicy Audio extractor image pull policy
## @extra images.credentials.username Username for container registry authentication
## @extra images.credentials.password Password for container registry authentication
## @extra images.credentials.registry Registry url for which the credentials are specified
## @extra images.credentials.name Name of the generated secret for imagePullSecrets
images:
  backend:
    repository: lasuite/dictaphone-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  frontend:
    repository: lasuite/dictaphone-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  audioExtractor:
    repository: lasuite/dictaphone-audio-extractor
    pullPolicy: IfNotPresent
    tag: "latest"
  credentials: {}

## @param nameOverride Override the chart name
## @param fullnameOverride Override the full application name
nameOverride: ""
fullnameOverride: ""

## @skip commonEnvVars
commonEnvVars: &commonEnvVars
  <<: []

## @param ingress.enabled whether to enable the Ingress or not
## @param ingress.className IngressClass to use for the Ingress
## @param ingress.host Host for the Ingress
## @param ingress.path Path to use for the Ingress
ingress:
  enabled: false
  className: null
  host: dictaphone.example.com
  path: /
  ## @param ingress.hosts Additional host to configure for the Ingress
  hosts: []
  #  - chart-example.local
  ## @param ingress.tls.enabled Weather to enable TLS for the Ingress
  ## @param ingress.tls.secretName Secret name for TLS config
  ## @skip ingress.tls.additional
  ## @extra ingress.tls.additional[].secretName Secret name for additional TLS config
  ## @extra ingress.tls.additional[].hosts[] Hosts for additional TLS config
  tls:
    secretName: null
    enabled: true
    additional: []

  ## @param ingress.customBackends Add custom backends to ingress
  customBackends: []

## @param ingressPublic.enabled Whether to enable the public API Ingress
## @param ingressPublic.className IngressClass to use for the Ingress
## @param ingressPublic.host Host for the Ingress
## @param ingressPublic.hosts Additional hosts for the Ingress
## @param ingressPublic.paths Backend route prefixes for the Ingress
## @param ingressPublic.annotations Annotations for the Ingress
## @param ingressPublic.tls.enabled Whether to enable TLS for the Ingress
## @param ingressPublic.tls.secretName Secret name for TLS config (defaults to the main ingress secret)
## @skip ingressPublic.tls.additional
## @extra ingressPublic.tls.additional[].secretName Secret name for additional TLS config
## @extra ingressPublic.tls.additional[].hosts[] Hosts for additional TLS config
ingressPublic:
  enabled: false
  className: null
  host: dictaphone.example.com
  hosts: []
  paths:
    - /api/
    - /external-api/
  # Disable response compression to mitigate BREACH (CVE-2013-3587).
  # Requires ingress-nginx with configuration snippets allowed.
  # Clear negotiation for Brotli without requiring its optional module to be loaded.
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      gzip off;
      more_clear_input_headers Accept-Encoding;
      proxy_set_header Accept-Encoding "";
  tls:
    secretName: null
    enabled: true
    additional: []

## @param ingressInternal.enabled Whether to enable the internal API Ingress
## @param ingressInternal.className IngressClass to use for the Ingress
## @param ingressInternal.host Host for the Ingress
## @param ingressInternal.hosts Additional hosts for the Ingress
## @param ingressInternal.paths Backend route prefixes for the Ingress
## @param ingressInternal.annotations Annotations for the Ingress
## @param ingressInternal.tls.enabled Whether to enable TLS for the Ingress
## @param ingressInternal.tls.secretName Secret name for TLS config (defaults to the main ingress secret)
## @skip ingressInternal.tls.additional
## @extra ingressInternal.tls.additional[].secretName Secret name for additional TLS config
## @extra ingressInternal.tls.additional[].hosts[] Hosts for additional TLS config
ingressInternal:
  enabled: false
  className: null
  host: dictaphone.example.com
  hosts: []
  paths:
    - /api/internal/
    - /api/v1.0/files/media-auth
    - /api/v1.0/ai-jobs/webhook
  # Set nginx.ingress.kubernetes.io/whitelist-source-range to trusted CIDRs.
  annotations: {}
  tls:
    secretName: null
    enabled: true
    additional: []

## @param ingressAdmin.enabled whether to enable the Ingress or not
## @param ingressAdmin.className IngressClass to use for the Ingress
## @param ingressAdmin.host Host for the Ingress
## @param ingressAdmin.path Path to use for the Ingress
ingressAdmin:
  enabled: false
  className: null
  host: dictaphone.example.com
  path: /admin
  ## @param ingressAdmin.hosts Additional host to configure for the Ingress
  hosts: []
  #  - chart-example.local
  ## @param ingressAdmin.tls.enabled Weather to enable TLS for the Ingress
  ## @param ingressAdmin.tls.secretName Secret name for TLS config
  ## @skip ingressAdmin.tls.additional
  ## @extra ingressAdmin.tls.additional[].secretName Secret name for additional TLS config
  ## @extra ingressAdmin.tls.additional[].hosts[] Hosts for additional TLS config
  tls:
    secretName: null
    enabled: true
    additional: []

## @param ingressMediaFiles List of media files ingresses to create
## @param ingressMediaFiles[].name Unique name for the ingress and its provider entry
## @param ingressMediaFiles[].serviceName Name of the serviceMediaFiles entry to route to (defaults to name)
## @param ingressMediaFiles[].enabled Whether to enable this Ingress
## @param ingressMediaFiles[].className IngressClass to use for this Ingress
## @param ingressMediaFiles[].host Host for this Ingress
## @param ingressMediaFiles[].path Path to use for this Ingress
ingressMediaFiles:
  - name: default
    serviceName: default
    enabled: false
    className: null
    host: dictaphone.example.com
    path: /media/(.*)
    ## @param ingressMediaFiles[].hosts Additional hosts to configure for the Ingress
    hosts: []
    ## @param ingressMediaFiles[].tls.enabled Whether to enable TLS for the Ingress
    ## @param ingressMediaFiles[].tls.secretName Secret name for TLS config
    ## @skip ingressMediaFiles[].tls.additional
    ## @extra ingressMediaFiles[].tls.additional[].secretName Secret name for additional TLS config
    ## @extra ingressMediaFiles[].tls.additional[].hosts[] Hosts for additional TLS config
    tls:
      secretName: null
      enabled: true
      additional: []

    ## @param ingressMediaFiles[].annotations.nginx.ingress.kubernetes.io/use-regex Enable use of regex for ingress paths
    ## @param ingressMediaFiles[].annotations.nginx.ingress.kubernetes.io/auth-url Authentication URL for the ingress
    ## @param ingressMediaFiles[].annotations.nginx.ingress.kubernetes.io/auth-response-headers Headers to pass from auth response
    ## @param ingressMediaFiles[].annotations.nginx.ingress.kubernetes.io/upstream-vhost Upstream host for proxying
    ## @param ingressMediaFiles[].annotations.nginx.ingress.kubernetes.io/configuration-snippet Custom nginx configuration snippet
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/auth-url: https://dictaphone.example.com/api/v1.0/files/media-auth/
      nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, X-Amz-Date, X-Amz-Content-SHA256"
      nginx.ingress.kubernetes.io/upstream-vhost: rustfs.dictaphone.svc.cluster.local:9000
      nginx.ingress.kubernetes.io/configuration-snippet: |
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Content-Disposition "attachment";

## @param serviceMediaFiles List of ExternalName services for media files providers
## @param serviceMediaFiles[].name Unique name for this provider service
## @param serviceMediaFiles[].host External hostname for this provider
## @param serviceMediaFiles[].port Port for this provider
## @param serviceMediaFiles[].annotations Annotations to add to this Service
serviceMediaFiles:
  - name: default
    host: rustfs.dictaphone.svc.cluster.local
    port: 9000
    annotations: {}

## @section backend

backend:
  ## @param backend.dpAnnotations Annotations to add to the backend Deployment
  dpAnnotations: {}

  ## @param backend.command Override the backend container command
  command: []

  ## @param backend.args Override the backend container args
  args: []

  ## @param backend.replicas Amount of backend replicas
  replicas: 3

  ## @param backend.shareProcessNamespace Enable share process namespace between containers
  shareProcessNamespace: false

  ## @param backend.sidecars Add sidecars containers to backend deployment
  sidecars: []

  ## @param backend.migrateJobAnnotations Annotations for the migrate job
  migrateJobAnnotations: {}

  ## @param backend.jobs.ttlSecondsAfterFinished Period to wait before remove jobs
  ## @param backend.jobs.backoffLimit Numbers of jobs retries
  jobs:
    ttlSecondsAfterFinished: 30
    backoffLimit: 2

  ## @param backend.securityContext Configure backend container security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  ## @param backend.envVars Configure backend container environment variables
  ## @extra backend.envVars.BY_VALUE Example environment variable by setting value directly
  ## @extra backend.envVars.FROM_CONFIGMAP.configMapKeyRef.name Name of a ConfigMap when configuring env vars from a ConfigMap
  ## @extra backend.envVars.FROM_CONFIGMAP.configMapKeyRef.key Key within a ConfigMap when configuring env vars from a ConfigMap
  ## @extra backend.envVars.FROM_SECRET.secretKeyRef.name Name of a Secret when configuring env vars from a Secret
  ## @extra backend.envVars.FROM_SECRET.secretKeyRef.key Key within a Secret when configuring env vars from a Secret
  ## @skip backend.envVars
  envVars:
    <<: *commonEnvVars

  ## @param backend.podAnnotations Annotations to add to the backend Pod
  podAnnotations: {}

  ## @param backend.service.type backend Service type
  ## @param backend.service.port backend Service listening port
  ## @param backend.service.targetPort backend container listening port
  ## @param backend.service.annotations Annotations to add to the backend Service
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
    annotations: {}

  ## @param backend.migrate.command backend migrate command
  ## @param backend.migrate.restartPolicy backend migrate job restart policy
  migrate:
    command:
      - "/bin/sh"
      - "-c"
      - |
        while ! python manage.py check --database default > /dev/null 2>&1
        do
          echo "Database not ready"
          sleep 2
        done
        echo "Database is ready"

        python manage.py migrate --no-input
    restartPolicy: Never

  ## @param backend.createsuperuser.command backend migrate command
  ## @param backend.createsuperuser.restartPolicy backend migrate job restart policy
  createsuperuser:
    command:
      - "/bin/sh"
      - "-c"
      - |
        while ! python manage.py check --database default > /dev/null 2>&1
        do
          echo "Database not ready"
          sleep 2
        done
        echo "Database is ready"

        python manage.py createsuperuser --email $DJANGO_SUPERUSER_EMAIL --password $DJANGO_SUPERUSER_PASSWORD
    restartPolicy: Never

  ## @section Jobs

  ## Schedule jobs at fixed times (like cron)
  ## Each cron job can be configured with name, schedule time and command.
  ## @param backend.cronjobs[0].name Name of the CronJob
  ## @param backend.cronjobs[0].schedule Schedule in cron format
  ## @param backend.cronjobs[0].command The bash command to execute in the CronJob
  ## @param backend.cronjobs[1].name Name of the CronJob
  ## @param backend.cronjobs[1].schedule Schedule in cron format
  ## @param backend.cronjobs[1].command The bash command to execute in the CronJob
  ## @param backend.cronjobs[2].name Name of the CronJob
  ## @param backend.cronjobs[2].schedule Schedule in cron format
  ## @param backend.cronjobs[2].command The bash command to execute in the CronJob
  ## @param backend.cronjobs[3].name Name of the CronJob
  ## @param backend.cronjobs[3].schedule Schedule in cron format
  ## @param backend.cronjobs[3].command The bash command to execute in the CronJob
  ## @param backend.cronjobs[4].name Name of the CronJob
  ## @param backend.cronjobs[4].schedule Schedule in cron format
  ## @param backend.cronjobs[4].command The bash command to execute in the CronJob

  cronjobs:
    - name: delete-original-files-data
      schedule: "1 0 * * *"
      command:
        - "/bin/sh"
        - "-c"
        - "python manage.py delete_original_files_data"
    - name: auto-hard-delete-files
      schedule: "15 0 * * *"
      command:
        - "/bin/sh"
        - "-c"
        - "python manage.py auto_hard_delete_files"
    - name: clean-pending-files
      schedule: "30 0 * * *"
      command:
        - "/bin/sh"
        - "-c"
        - "python manage.py clean_pending_files"
    - name: purge-deleted-files
      schedule: "45 0 * * *"
      command:
        - "/bin/sh"
        - "-c"
        - "python manage.py purge_deleted_files"
    - name: purge-transcription-usage
      schedule: "0 1 * * *"
      command:
        - "/bin/sh"
        - "-c"
        - "python manage.py purge_transcription_usage"

  ## @param backend.probes Kubernetes probe definitions; set an individual probe to null to disable it
  probes:
    # Only readiness checks dependencies; outages must not restart the app.
    liveness:
      httpGet:
        path: /__lbheartbeat__
        port: http
      initialDelaySeconds: 5
      periodSeconds: 30
    readiness:
      httpGet:
        path: /__heartbeat__
        port: http
      initialDelaySeconds: 5
      timeoutSeconds: 5
      periodSeconds: 30
    startup:
      httpGet:
        path: /__lbheartbeat__
        port: http
      periodSeconds: 5
      failureThreshold: 30

  ## @param backend.resources Resource requirements for the backend container
  resources: {}

  ## @param backend.nodeSelector Node selector for the backend Pod
  nodeSelector: {}

  ## @param backend.tolerations Tolerations for the backend Pod
  tolerations: []

  ## @param backend.affinity Affinity for the backend Pod
  affinity: {}

  ## @param backend.persistence Additional volumes to create and mount on the backend. Used for debugging purposes
  ## @extra backend.persistence.volume-name.size Size of the additional volume
  ## @extra backend.persistence.volume-name.type Type of the additional volume, persistentVolumeClaim or emptyDir
  ## @extra backend.persistence.volume-name.mountPath Path where the volume should be mounted to
  persistence: {}

  ## @param backend.tmpVolume Volume backing writable /tmp; defaults to emptyDir when unset, independent of additional volumes
  tmpVolume: {}

  ## @param backend.extraVolumeMounts Additional volumes to mount on the backend.
  extraVolumeMounts: []

  ## @param backend.extraVolumes Additional volumes to mount on the backend.
  extraVolumes: []

  ## @param backend.pdb.enabled Enable pdb on backend
  pdb:
    enabled: true

## @section celeryBackend
celeryBackend:
  ## @param celeryBackend.dpAnnotations Annotations to add to the celeryBackend Deployment
  dpAnnotations: {}

  ## @param celeryBackend.command Override the celeryBackend container command
  command:
    - "celery"
    - "-A"
    - "dictaphone.celery_app"
    - "worker"
    - "--loglevel=info"
    - "-Q"
    - "dictaphone-backend"

  ## @param celeryBackend.args Override the celeryBackend container args
  args: []

  ## @param celeryBackend.replicas Amount of celeryBackend replicas
  replicas: 1

  ## @param celeryBackend.shareProcessNamespace Enable share process namespace between containers
  shareProcessNamespace: false

  ## @param celeryBackend.sidecars Add sidecars containers to celeryBackend deployment
  sidecars: []

  ## @param celeryBackend.migrateJobAnnotations Annotations for the migrate job
  migrateJobAnnotations: {}

  ## @param celeryBackend.securityContext Configure celeryBackend container security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  ## @param celeryBackend.envVars Configure celeryBackend container environment variables
  ## @extra celeryBackend.envVars.BY_VALUE Example environment variable by setting value directly
  ## @extra celeryBackend.envVars.FROM_CONFIGMAP.configMapKeyRef.name Name of a ConfigMap when configuring env vars from a ConfigMap
  ## @extra celeryBackend.envVars.FROM_CONFIGMAP.configMapKeyRef.key Key within a ConfigMap when configuring env vars from a ConfigMap
  ## @extra celeryBackend.envVars.FROM_SECRET.secretKeyRef.name Name of a Secret when configuring env vars from a Secret
  ## @extra celeryBackend.envVars.FROM_SECRET.secretKeyRef.key Key within a Secret when configuring env vars from a Secret
  ## @skip celeryBackend.envVars
  envVars:
    <<: *commonEnvVars

  ## @param celeryBackend.podAnnotations Annotations to add to the celeryBackend Pod
  podAnnotations: {}

  ## @param celeryBackend.service.type celeryBackend Service type
  ## @param celeryBackend.service.port celeryBackend Service listening port
  ## @param celeryBackend.service.targetPort celeryBackend container listening port
  ## @param celeryBackend.service.annotations Annotations to add to the celeryBackend Service
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
    annotations: {}

  ## @param celeryBackend.probes Kubernetes probe definitions; set an individual probe to null to disable it
  probes: {}

  ## @param celeryBackend.resources Resource requirements for the celeryBackend container
  resources: {}

  ## @param celeryBackend.nodeSelector Node selector for the celeryBackend Pod
  nodeSelector: {}

  ## @param celeryBackend.tolerations Tolerations for the celeryBackend Pod
  tolerations: []

  ## @param celeryBackend.affinity Affinity for the celeryBackend Pod
  affinity: {}

  ## @param celeryBackend.persistence Additional volumes to create and mount on the celeryBackend. Used for debugging purposes
  ## @extra celeryBackend.persistence.volume-name.size Size of the additional volume
  ## @extra celeryBackend.persistence.volume-name.type Type of the additional volume, persistentVolumeClaim or emptyDir
  ## @extra celeryBackend.persistence.volume-name.mountPath Path where the volume should be mounted to
  persistence: {}

  ## @param celeryBackend.tmpVolume Volume backing writable /tmp; defaults to emptyDir when unset, independent of additional volumes
  tmpVolume: {}

  ## @param celeryBackend.extraVolumeMounts Additional volumes to mount on the celeryBackend.
  extraVolumeMounts: []

  ## @param celeryBackend.extraVolumes Additional volumes to mount on the celeryBackend.
  extraVolumes: []

  ## @param celeryBackend.pdb.enabled Enable pdb on celeryBackend
  pdb:
    enabled: false

## @section audioExtractor
audioExtractor:
  ## @param audioExtractor.dpAnnotations Annotations to add to the audio worker Deployment
  dpAnnotations: {}

  ## @param audioExtractor.command Command used by the audio extraction worker, enforcing its process watchdog
  command:
    - "sh"
    - "/app/run-worker.sh"

  ## @param audioExtractor.args Additional audio worker arguments
  args: []

  ## @param audioExtractor.transcodingReplicas Amount of transcoding worker replicas
  transcodingReplicas: 1

  ## @param audioExtractor.validationReplicas Amount of validation worker replicas
  validationReplicas: 1

  ## @param audioExtractor.terminationGracePeriodSeconds Time for bounded cancellation and cleanup
  terminationGracePeriodSeconds: 45

  ## @param audioExtractor.strategy Deployment rollout strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  ## @param audioExtractor.probes Kubernetes HTTP probes; set an individual probe to null to disable it
  probes:
    startup:
      httpGet:
        path: /startupz
        port: health
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 30
    liveness:
      httpGet:
        path: /livez
        port: health
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      httpGet:
        path: /readyz
        port: health
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2

  ## @param audioExtractor.shareProcessNamespace Enable share process namespace between containers
  shareProcessNamespace: false

  ## @param audioExtractor.sidecars Add sidecars containers to audio worker deployment
  sidecars: []

  ## @param audioExtractor.initContainers Init containers in audio worker Pods
  initContainers: []

  ## @param audioExtractor.automountServiceAccountToken Mount a service-account token in audio worker Pods
  automountServiceAccountToken: false

  ## @param audioExtractor.serviceAccountName Existing service account for audio worker Pods
  serviceAccountName: ""

  ## @param audioExtractor.podSecurityContext Audio worker Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    fsGroup: 10000
    seccompProfile:
      type: RuntimeDefault

  ## @param audioExtractor.securityContext Configure audio worker container security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    capabilities:
      drop: ["ALL"]

  ## @param audioExtractor.envVars Configure audio worker environment variables
  ## @skip audioExtractor.envVars
  envVars:
    AUDIO_EXTRACTOR_MAX_RUNTIME_SECONDS: 900
    AUDIO_EXTRACTOR_PROCESS_TIMEOUT_SECONDS: 1200
    AUDIO_EXTRACTOR_SHUTDOWN_GRACE_SECONDS: 30
    AUDIO_EXTRACTOR_POLL_INTERVAL_SECONDS: 5
    AUDIO_EXTRACTOR_HEALTH_PORT: 8080

  ## @param audioExtractor.transcodingEnvVars Environment variables for the transcoding worker; configure its dedicated API token here
  transcodingEnvVars: {}

  ## @param audioExtractor.validationEnvVars Environment variables for the validation worker; configure its dedicated API token here
  validationEnvVars: {}

  ## @param audioExtractor.podAnnotations Annotations to add to the audio worker Pod
  podAnnotations: {}

  ## @param audioExtractor.resources Resource requirements for the audio worker container
  resources: {}

  ## @param audioExtractor.nodeSelector Node selector for the audio worker Pod
  nodeSelector: {}

  ## @param audioExtractor.tolerations Tolerations for the audio worker Pod
  tolerations: []

  ## @param audioExtractor.affinity Affinity for the audio worker Pod
  affinity: {}

  ## @param audioExtractor.persistence Additional volumes to create and mount on the audio worker. Used for debugging purposes
  ## @extra audioExtractor.persistence.volume-name.size Size of the additional volume
  ## @extra audioExtractor.persistence.volume-name.type Type of the additional volume, persistentVolumeClaim or emptyDir
  ## @extra audioExtractor.persistence.volume-name.mountPath Path where the volume should be mounted to
  persistence: {}

  ## @param audioExtractor.workVolume Kubernetes volume source for the /work workspace
  workVolume:
    emptyDir:
      sizeLimit: 4Gi

  ## @param audioExtractor.extraVolumeMounts Additional native Kubernetes volume mounts for audio workers
  extraVolumeMounts: []

  ## @param audioExtractor.extraVolumes Additional Kubernetes volumes; existingClaim is also supported for PVCs
  extraVolumes: []

  ## @param audioExtractor.pdb.enabled Enable pdb on the audio worker
  ## @param audioExtractor.pdb.maxUnavailable Maximum unavailable audio worker Pods (count or percentage)
  pdb:
    maxUnavailable: 1
    enabled: false

## @section frontend

frontend:
  ## @param frontend.dpAnnotations Annotations to add to the frontend Deployment
  dpAnnotations: {}

  ## @param frontend.command Override the frontend container command
  command: []

  ## @param frontend.args Override the frontend container args
  args: []

  ## @param frontend.replicas Amount of frontend replicas
  replicas: 3

  ## @param frontend.shareProcessNamespace Enable share process namefrontend between containers
  shareProcessNamespace: false

  ## @param frontend.sidecars Add sidecars containers to frontend deployment
  sidecars: []

  ## @param frontend.securityContext Configure frontend container security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

  ## @param frontend.envVars Configure frontend container environment variables
  ## @extra frontend.envVars.BY_VALUE Example environment variable by setting value directly
  ## @extra frontend.envVars.FROM_CONFIGMAP.configMapKeyRef.name Name of a ConfigMap when configuring env vars from a ConfigMap
  ## @extra frontend.envVars.FROM_CONFIGMAP.configMapKeyRef.key Key within a ConfigMap when configuring env vars from a ConfigMap
  ## @extra frontend.envVars.FROM_SECRET.secretKeyRef.name Name of a Secret when configuring env vars from a Secret
  ## @extra frontend.envVars.FROM_SECRET.secretKeyRef.key Key within a Secret when configuring env vars from a Secret
  ## @skip frontend.envVars
  envVars:
    <<: *commonEnvVars

  ## @param frontend.podAnnotations Annotations to add to the frontend Pod
  podAnnotations: {}

  ## @param frontend.service.type frontend Service type
  ## @param frontend.service.port frontend Service listening port
  ## @param frontend.service.targetPort frontend container listening port
  ## @param frontend.service.annotations Annotations to add to the frontend Service
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
    annotations: {}

  ## @param frontend.probes Kubernetes probe definitions; set an individual probe to null to disable it
  probes:
    liveness:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 5
      periodSeconds: 30
      timeoutSeconds: 2
    readiness:
      httpGet:
        path: /
        port: http
      periodSeconds: 5
      timeoutSeconds: 2

  ## @param frontend.resources Resource requirements for the frontend container
  resources: {}

  ## @param frontend.nodeSelector Node selector for the frontend Pod
  nodeSelector: {}

  ## @param frontend.tolerations Tolerations for the frontend Pod
  tolerations: []

  ## @param frontend.affinity Affinity for the frontend Pod
  affinity: {}

  ## @param frontend.persistence Additional volumes to create and mount on the frontend. Used for debugging purposes
  ## @extra frontend.persistence.volume-name.size Size of the additional volume
  ## @extra frontend.persistence.volume-name.type Type of the additional volume, persistentVolumeClaim or emptyDir
