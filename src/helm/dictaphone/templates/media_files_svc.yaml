{{- $fullName := include "dictaphone.fullname" . -}}
{{- $component := "media-files" -}}
{{- $root := . -}}
{{- range $root.Values.serviceMediaFiles }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dictaphone.mediaFiles.fullname" (dict "fullname" $fullName "name" .name) }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "dictaphone.common.labels" (list $root $component) | nindent 4 }}
  annotations:
    {{- toYaml (.annotations | default (dict)) | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .host }}
{{ end }}
