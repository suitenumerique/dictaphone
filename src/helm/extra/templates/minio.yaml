---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1g
spec:
  rules:
  - host: "minio-dictaphone.127.0.0.1.nip.io"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              number: 9000
  tls:
  - hosts:
    - minio-dictaphone.127.0.0.1.nip.io
    secretName: dictaphone-tls
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace | quote }}
spec:
  ports:
  - name: client
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: console
    port: 9001
    protocol: TCP
    targetPort: 9001
  selector:
    app.kubernetes.io/instance: extra
    app.kubernetes.io/name: minio
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/instance: extra
    app.kubernetes.io/name: minio
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: extra
      app.kubernetes.io/name: minio
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: extra
        app.kubernetes.io/name: minio
    spec:
      containers:
      - name: minio
        command:
          - /bin/sh
          - -c
          - |
            minio server --console-address :9001 /data
        env:
          - name: MINIO_ROOT_USER
            value: dictaphone
          - name: MINIO_ROOT_PASSWORD
            value: password
        image: "minio/minio"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
          name: client
        - containerPort: 9001
          name: console
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /etc/ssl/certs/mkcert-ca.pem
          name: mkcert
          subPath: rootCA.pem
      volumes:
      - name: data
        emptyDir:
      - name: mkcert
        secret:
          secretName: mkcert
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket
spec:
  template:
    spec:
      containers:
      - name: mc
        image: minio/mc
        command:
          - /bin/sh
          - -c
          - |
            /usr/bin/mc alias set dictaphone http://minio:9000 dictaphone password && \
            /usr/bin/mc mb --ignore-existing dictaphone/dictaphone-media-storage && \
            /usr/bin/mc mb --ignore-existing dictaphone/dictaphone-media-alpha && \
            /usr/bin/mc mb --ignore-existing dictaphone/dictaphone-media-beta && \
            /usr/bin/mc admin user add dictaphone dictaphone-default password-default || true; \
            /usr/bin/mc admin user add dictaphone dictaphone-alpha password-alpha || true; \
            /usr/bin/mc admin user add dictaphone dictaphone-beta password-beta || true; \
            printf '%s' '{"Version":"2012-10-17","Statement":[{"Action":["s3:*"],"Effect":"Allow","Resource":["arn:aws:s3:::dictaphone-media-storage","arn:aws:s3:::dictaphone-media-storage/*"]}]}' >/tmp/default-policy.json && \
            printf '%s' '{"Version":"2012-10-17","Statement":[{"Action":["s3:*"],"Effect":"Allow","Resource":["arn:aws:s3:::dictaphone-media-alpha","arn:aws:s3:::dictaphone-media-alpha/*"]}]}' >/tmp/alpha-policy.json && \
            printf '%s' '{"Version":"2012-10-17","Statement":[{"Action":["s3:*"],"Effect":"Allow","Resource":["arn:aws:s3:::dictaphone-media-beta","arn:aws:s3:::dictaphone-media-beta/*"]}]}' >/tmp/beta-policy.json && \
            /usr/bin/mc admin policy create dictaphone default-bucket-policy /tmp/default-policy.json || true; \
            /usr/bin/mc admin policy create dictaphone alpha-bucket-policy /tmp/alpha-policy.json || true; \
            /usr/bin/mc admin policy create dictaphone beta-bucket-policy /tmp/beta-policy.json || true; \
            /usr/bin/mc admin policy attach dictaphone default-bucket-policy --user dictaphone-default || true; \
            /usr/bin/mc admin policy attach dictaphone alpha-bucket-policy --user dictaphone-alpha || true; \
            /usr/bin/mc admin policy attach dictaphone beta-bucket-policy --user dictaphone-beta || true; \
            exit 0
      restartPolicy: Never
  backoffLimit: 3
