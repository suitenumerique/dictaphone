[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dictaphone-audio-extractor"
version = "0.15.2"
description = "Isolated audio conversion worker"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.13,<4",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.7,<3",
    "requests==2.34.2",
    "sentry-sdk==2.71.0",
]

[dependency-groups]
dev = [
    "boto3>=1.35,<2",
    "pylint>=4,<5",
    "pytest==9.1.1",
    "pytest-aiohttp==1.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.15.19",
    "trustme==1.2.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "BLE", "C4", "I", "PLC", "PLE", "PLR", "PLW", "RUF100", "S", "T20"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
addopts = ["-v"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
