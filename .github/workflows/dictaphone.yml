name: dictaphone Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint-back:
    permissions:
      contents: read
    uses: suitenumerique/ci/.github/workflows/_python-lint.yml@ca6401ac83e981e5b0a94f06f68baaa6e6d0a436 # v0.0.1
    with:
      working_directory: src/backend
      pylint_targets: dictaphone demo core

  test-back:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dictaphone
          POSTGRES_USER: dinum
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:5
        ports:
          - 6379:6379
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_CONFIGURATION: Test
      DJANGO_SETTINGS_MODULE: dictaphone.settings
      DJANGO_SECRET_KEY: ThisIsAnExampleKeyForTestPurposeOnly
      SIMPLE_JWT_SIGNING_KEY: ThisIsAnExampleKeyForTestPurposeOnly
      OIDC_OP_JWKS_ENDPOINT: /endpoint-for-test-purpose-only
      DB_HOST: localhost
      DB_NAME: dictaphone
      DB_USER: dinum
      DB_PASSWORD: pass
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/1
      STORAGES_STATICFILES_BACKEND: django.contrib.staticfiles.storage.StaticFilesStorage
      S3_DEFAULT_ACCESS_KEY_ID: dictaphone-default
      S3_DEFAULT_SECRET_ACCESS_KEY: password-default
      S3_DEFAULT_BUCKET_NAME: dictaphone-media-storage
      S3_ALPHA_ACCESS_KEY_ID: dictaphone-alpha
      S3_ALPHA_SECRET_ACCESS_KEY: password-alpha
      S3_ALPHA_BUCKET_NAME: dictaphone-media-alpha
      S3_BETA_ACCESS_KEY_ID: dictaphone-beta
      S3_BETA_SECRET_ACCESS_KEY: password-beta
      S3_BETA_BUCKET_NAME: dictaphone-media-beta
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET_CONFIGURATIONS: '{"default":{"bucket_name_env":"S3_DEFAULT_BUCKET_NAME","access_key_id_env":"S3_DEFAULT_ACCESS_KEY_ID","secret_access_key_env":"S3_DEFAULT_SECRET_ACCESS_KEY","endpoint_url_env":"S3_ENDPOINT_URL","region_name":"local","signature_version":"s3v4"},"alpha":{"bucket_name_env":"S3_ALPHA_BUCKET_NAME","access_key_id_env":"S3_ALPHA_ACCESS_KEY_ID","secret_access_key_env":"S3_ALPHA_SECRET_ACCESS_KEY","endpoint_url_env":"S3_ENDPOINT_URL","region_name":"local","signature_version":"s3v4"},"beta":{"bucket_name_env":"S3_BETA_BUCKET_NAME","access_key_id_env":"S3_BETA_ACCESS_KEY_ID","secret_access_key_env":"S3_BETA_SECRET_ACCESS_KEY","endpoint_url_env":"S3_ENDPOINT_URL","region_name":"local","signature_version":"s3v4"}}'
      DATA_POLICY_CONFIGURATIONS: '{"default":{"default":True,"bucket":"default"},"alpha":{"domains":["alpha.example"],"bucket":"alpha","file_auto_hard_delete_after_days":14,"original_file_data_delete_after_days":7},"beta":{"domains":["beta.example"],"bucket":"beta","file_auto_hard_delete_after_days":30,"original_file_data_delete_after_days":14}}'
      OIDC_RS_CLIENT_ID: dictaphone
      OIDC_RS_CLIENT_SECRET: ThisIsAnExampleKeyForDevPurposeOnly
      OIDC_OP_INTROSPECTION_ENDPOINT: https://oidc.example.com/introspect
      OIDC_OP_URL: https://oidc.example.com
      MEDIA_BASE_URL: http://localhost:8083

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Create writable /data
        run: |
          sudo mkdir -p /data/media && \
          sudo chown -R 10001:10001 /data/media && \
          sudo mkdir -p /data/static

      - name: Start RustFS
        run: |
          docker pull rustfs/rustfs:latest
          docker run -d --name rustfs \
            -p 9000:9000 \
            -e "RUSTFS_ACCESS_KEY=dictaphone" \
            -e "RUSTFS_SECRET_KEY=password" \
            -v /data/media:/data \
            rustfs/rustfs:latest /data

      # Tool to wait for a service to be ready
      - name: Install Dockerize
        run: |
          curl -sSL https://github.com/jwilder/dockerize/releases/download/v0.8.0/dockerize-linux-amd64-v0.8.0.tar.gz | sudo tar -C /usr/local/bin -xzv

      - name: Wait for RustFS to be ready
        run: |
          dockerize -wait http://localhost:9000/health/ready -timeout 30s

      - name: Configure RustFS
        run: |
          docker pull rustfs/rc:latest
          docker run --rm --network host --entrypoint /bin/sh rustfs/rc:latest -c \
            "until rc alias set dictaphone http://localhost:9000 dictaphone password; do sleep 1; done && \
            until rc ready dictaphone; do sleep 1; done && \
            rc mb --ignore-existing dictaphone/dictaphone-media-storage && \
            rc mb --ignore-existing dictaphone/dictaphone-media-alpha && \
            rc mb --ignore-existing dictaphone/dictaphone-media-beta && \
            rc admin user add dictaphone dictaphone-default password-default && \
            rc admin user add dictaphone dictaphone-alpha password-alpha && \
            rc admin user add dictaphone dictaphone-beta password-beta && \
            printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Action\":[\"s3:*\"],\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:s3:::dictaphone-media-storage\",\"arn:aws:s3:::dictaphone-media-storage/*\"]}]}' >/tmp/default-policy.json && \
            printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Action\":[\"s3:*\"],\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:s3:::dictaphone-media-alpha\",\"arn:aws:s3:::dictaphone-media-alpha/*\"]}]}' >/tmp/alpha-policy.json && \
            printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Action\":[\"s3:*\"],\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:s3:::dictaphone-media-beta\",\"arn:aws:s3:::dictaphone-media-beta/*\"]}]}' >/tmp/beta-policy.json && \
            rc admin policy create dictaphone default-bucket-policy /tmp/default-policy.json && \
            rc admin policy create dictaphone alpha-bucket-policy /tmp/alpha-policy.json && \
            rc admin policy create dictaphone beta-bucket-policy /tmp/beta-policy.json && \
            rc admin policy attach dictaphone default-bucket-policy --user dictaphone-default && \
            rc admin policy attach dictaphone alpha-bucket-policy --user dictaphone-alpha && \
            rc admin policy attach dictaphone beta-bucket-policy --user dictaphone-beta"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: src/backend/pyproject.toml
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install the dependencies
        run: uv sync --locked --all-extras

      - name: Install gettext (required to compile messages)
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Generate a MO file from strings extracted from the project
        run: uv run python manage.py compilemessages

      - name: Run tests
        run: uv run pytest -n 2

  lint-front:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: cd src/frontend/ && npm ci

      - name: Check linting
        run: cd src/frontend/ && npm run lint

      - name: Check format
        run: cd src/frontend/ && npm run check

  lint-mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: src/mobile/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check linting
        run: yarn run lint

      - name: Check format
        run: yarn run check

      - name: Check types
        run: yarn run tsc
